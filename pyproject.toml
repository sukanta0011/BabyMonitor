[project]
name = "babymonitor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "asyncpg>=0.31.0",
    "fastapi>=0.140.13",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.60.0",
    "tqdm>=4.70.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-tqdm",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.uv]
override-dependencies = [
    "opencv-contrib-python; sys_platform == 'never'",
]

[project.optional-dependencies]
mediapipe-support = [
    "mediapipe>=0.10.35; platform_machine != 'aarch64'",
]
