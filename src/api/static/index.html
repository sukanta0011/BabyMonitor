<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Baby Monitor</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #101114;
    color: #f2f2f2;
    margin: 0;
    padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px);
    max-width: 720px;
    margin-inline: auto;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 2px 14px;
  }
  header h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.2px;
  }
  #dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #555;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.04);
    transition: background 0.3s;
  }
  #dot.normal  { background: #34d17c; box-shadow: 0 0 0 4px rgba(52,209,124,0.15); }
  #dot.warning { background: #f5b942; box-shadow: 0 0 0 4px rgba(245,185,66,0.15); }
  #dot.error   { background: #f0483e; box-shadow: 0 0 0 4px rgba(240,72,62,0.15); }

  .camera-pills {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 2px 12px;
    -webkit-overflow-scrolling: touch;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 7px;
    flex: none;
    background: #1a1c20;
    border: 1px solid #2a2d33;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    color: #aaa;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, opacity 0.2s;
  }
  .pill.active {
    border-color: #4a90d9;
    color: #cfe4fb;
    background: rgba(74,144,217,0.1);
  }
  .pill.disabled {
    cursor: not-allowed;
    opacity: 0.5;
  }
  .pill-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #555;
    flex: none;
  }
  .pill-dot.on  { background: #34d17c; }
  .pill-dot.off { background: #f0483e; }

  #video-wrap {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    touch-action: pinch-zoom;
    overflow: hidden;
  }
  #video { 
    display: block;
    width: 100%;
    height: auto;
    transform-origin: center center;
    transition: transform 0.1s ease-out;
  }

  .status {
    margin: 12px 2px 18px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.35;
    background: #1a1c20;
    border: 1px solid #2a2d33;
    color: #aaa;
  }
  .status.normal  { background: rgba(52,209,124,0.1);  border-color: rgba(52,209,124,0.25);  color: #6fe3a4; }
  .status.warning { background: rgba(245,185,66,0.1);  border-color: rgba(245,185,66,0.25);  color: #f5c66b; }
  .status.error   { background: rgba(240,72,62,0.1);   border-color: rgba(240,72,62,0.25);   color: #f5847c; }

  .sensors {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .sensor-box {
    background: #1a1c20;
    border: 1px solid #2a2d33;
    border-radius: 14px;
    padding: 16px;
  }
  .sensor-box .label {
    font-size: 12.5px;
    color: #8b8d93;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .sensor-box .value {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }
  .sensor-box .unit {
    font-size: 14px;
    font-weight: 400;
    color: #8b8d93;
    margin-left: 2px;
  }

  @media (min-width: 480px) {
    .sensor-box .value { font-size: 34px; }
  }

  footer {
    text-align: center;
    font-size: 11.5px;
    color: #555;
    margin: 18px 0 6px;
  }
</style>
</head>
<body>

<header>
  <h1>Baby Monitor</h1>
  <div id="dot"></div>
</header>

<div class="camera-pills" id="camera-pills">
  <div class="pill active" id="pill-best" data-target="/video">
    <span class="pill-dot on"></span>
    Best stream
  </div>
</div>

<div id="video-wrap">
  <img id="video" src="/video" alt="camera feed">
</div>

<div id="status" class="status">Connecting…</div>

<div class="sensors">
  <div class="sensor-box">
    <div class="label">Light</div>
    <div class="value"><span id="light">—</span><span class="unit">lux</span></div>
  </div>
  <div class="sensor-box">
    <div class="label">CO2</div>
    <div class="value"><span id="co2">—</span><span class="unit">ppm</span></div>
  </div>
  <div class="sensor-box">
    <div class="label">Temperature</div>
    <div class="value"><span id="temp">—</span><span class="unit">°C</span></div>
  </div>
  <div class="sensor-box">
    <div class="label">Humidity</div>
    <div class="value"><span id="humidity">—</span><span class="unit">%</span></div>
  </div>
</div>

<footer id="camera-name">—</footer>

<script>
// Tracks which video source is currently selected — "best" or a camera name.
// Kept outside the DOM so pill rebuilds (pollCameras) never lose the selection.
let selectedTarget = "best";
let currentScale = 1;
let currentX = 0, currentY = 0;
let startDistance = 0;
let startX = 0, startY = 0;
let lastTouchX = 0, lastTouchY = 0;
let isPanning = false;

const videoEl = document.getElementById("video");
const wrapEl = document.getElementById("video-wrap");

function getDistance(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

function getMidpoint(touches) {
  return {
    x: (touches[0].clientX + touches[1].clientX) / 2,
    y: (touches[0].clientY + touches[1].clientY) / 2,
  };
}

function clampPan() {
  const rect = wrapEl.getBoundingClientRect();
  const maxOffsetX = (rect.width * (currentScale - 1)) / 2;
  const maxOffsetY = (rect.height * (currentScale - 1)) / 2;
  currentX = Math.min(Math.max(currentX, -maxOffsetX), maxOffsetX);
  currentY = Math.min(Math.max(currentY, -maxOffsetY), maxOffsetY);
}

function applyTransform() {
  videoEl.style.transform = `translate(${currentX}px, ${currentY}px) scale(${currentScale})`;
}

videoEl.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    startDistance = getDistance(e.touches);
    isPanning = false;
  } else if (e.touches.length === 1 && currentScale > 1) {
    isPanning = true;
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
  }
});

videoEl.addEventListener("touchmove", (e) => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const newDistance = getDistance(e.touches);
    currentScale = Math.min(Math.max(1, currentScale * (newDistance / startDistance)), 4);
    startDistance = newDistance;
    clampPan();
    applyTransform();
  } else if (e.touches.length === 1 && isPanning) {
    e.preventDefault();
    const dx = e.touches[0].clientX - lastTouchX;
    const dy = e.touches[0].clientY - lastTouchY;
    currentX += dx;
    currentY += dy;
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
    clampPan();
    applyTransform();
  }
});

videoEl.addEventListener("touchend", (e) => {
  if (e.touches.length < 1) isPanning = false;
  if (currentScale <= 1) { currentX = 0; currentY = 0; applyTransform(); }
});

function selectStream(target, videoSrc) {
  selectedTarget = target;
  document.getElementById("video").src = videoSrc;
  applyActivePillState();
}

function applyActivePillState() {
  document.querySelectorAll(".pill").forEach(pill => {
    const isActive = pill.dataset.key === selectedTarget;
    pill.classList.toggle("active", isActive);
  });
}

async function pollFrameInfo() {
  try {
    const res = await fetch("/frame_info");
    const data = await res.json();
    const status = data.status || "unknown";
    const statusEl = document.getElementById("status");
    statusEl.className = "status " + status;
    statusEl.textContent = data.message || "Monitoring";
    document.getElementById("dot").className = status;
    document.getElementById("camera-name").textContent =
      data.name ? `${data.name} · score ${data.score ?? "—"}` : "—";
  } catch (e) {
    console.error("frame_info poll failed", e);
  }
}

async function pollSensors() {
  try {
    const res = await fetch("/sensors");
    const data = await res.json();
    const bh = data.bh1750 || {};
    const scd = data.scd40 || {};
    document.getElementById("light").textContent =
      bh.lux != null ? bh.lux.toFixed(1) : "—";
    document.getElementById("co2").textContent =
      scd.co2 != null ? Math.round(scd.co2) : "—";
    document.getElementById("temp").textContent =
      scd.temperature != null ? scd.temperature.toFixed(1) : "—";
    document.getElementById("humidity").textContent =
      scd.humidity != null ? scd.humidity.toFixed(1) : "—";
  } catch (e) {
    console.error("sensors poll failed", e);
  }
}

async function pollCameras() {
  try {
    const res = await fetch("/cameras");
    const cameras = await res.json();
    const container = document.getElementById("camera-pills");

    // "Best stream" pill (index 0) is permanent — tag it once, then rebuild
    // only the per-camera pills after it on every poll.
    const bestPill = document.getElementById("pill-best");
    bestPill.dataset.key = "best";
    if (!bestPill.dataset.wired) {
      bestPill.addEventListener("click", () => selectStream("best", "/video"));
      bestPill.dataset.wired = "true";
    }

    while (container.children.length > 1) {
      container.removeChild(container.lastChild);
    }

    cameras.forEach(cam => {
      const pill = document.createElement("div");
      const online = !!cam.state;
      pill.className = "pill" + (online ? "" : " disabled");
      pill.dataset.key = cam.name;
      pill.innerHTML = `
        <span class="pill-dot ${online ? 'on' : 'off'}"></span>
        ${cam.name}
      `;
      if (online) {
        pill.addEventListener("click", () =>
          selectStream(cam.name, `/video/${encodeURIComponent(cam.name)}`));
      } else {
        pill.title = "Camera offline";
        // if the currently-selected camera just went offline, fall back to Best
        if (selectedTarget === cam.name) {
          selectStream("best", "/video");
        }
      }
      container.appendChild(pill);
    });

    applyActivePillState();
  } catch (e) {
    console.error("cameras poll failed", e);
  }
}

setInterval(pollFrameInfo, 500);
setInterval(pollSensors, 1000);
setInterval(pollCameras, 3000);
pollFrameInfo();
pollSensors();
pollCameras();
</script>

</body>
</html>
