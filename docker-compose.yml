services:
  db:
    image: postgres:16
    container_name: postgres_db
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=baby_monitor
      - POSTGRES_PASSWORD=baby_monitor
      - POSTGRES_DB=baby_monitor_db
    restart: unless-stopped
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baby_monitor -d baby_monitor_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  api:
    image: ghcr.io/sukanta0011/babymonitor:latest
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # build: .
    # devices:
    #   - /dev/video0:/dev/video0
    # group_add:
    #   - video
    volumes:
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=postgresql+asyncpg://baby_monitor:baby_monitor@db/baby_monitor_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 600 --label-enable
    restart: unless-stopped


volumes:
  postgres_data:
  